---
apiVersion: v1
kind: Service
metadata:
  name: fx-prometheus
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  selector:
    app: fx-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: fx-loki
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  selector:
    app: fx-loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: fx-tempo
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  selector:
    app: fx-tempo
  ports:
  - name: http
    port: 3200
    targetPort: 3200
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: fx-grafana
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  selector:
    app: fx-grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-prometheus
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-prometheus
  template:
    metadata:
      labels:
        app: fx-prometheus
    spec:
      serviceAccountName: fx-prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/tmp/prometheus
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: fx-prometheus-config
      enableServiceLinks: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-loki
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-loki
  template:
    metadata:
      labels:
        app: fx-loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.3.2
        imagePullPolicy: IfNotPresent
        args:
        - -config.file=/etc/loki/loki.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
      volumes:
      - name: config
        configMap:
          name: fx-loki-config
      enableServiceLinks: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-tempo
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-tempo
  template:
    metadata:
      labels:
        app: fx-tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:2.6.1
        imagePullPolicy: IfNotPresent
        args:
        - -config.file=/etc/tempo/tempo.yaml
        ports:
        - containerPort: 3200
          name: http
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        - name: config
          mountPath: /etc/tempo
      volumes:
      - name: config
        configMap:
          name: fx-tempo-config
      enableServiceLinks: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-grafana
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-grafana
  template:
    metadata:
      labels:
        app: fx-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.3.1
        imagePullPolicy: IfNotPresent
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_PATHS_DATA
          value: /tmp/grafana
        - name: GF_PATHS_LOGS
          value: /tmp/grafana/logs
        - name: GF_PATHS_PLUGINS
          value: /tmp/grafana/plugins
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fx-observability
              key: admin-password
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: grafana-data
          mountPath: /tmp/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-data
        emptyDir: {}
      - name: datasources
        configMap:
          name: fx-grafana-datasources
      - name: dashboard-provider
        configMap:
          name: fx-grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: fx-grafana-dashboard
      enableServiceLinks: false
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fx-grafana
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  to:
    kind: Service
    name: fx-grafana
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fx-prometheus
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  to:
    kind: Service
    name: fx-prometheus
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
