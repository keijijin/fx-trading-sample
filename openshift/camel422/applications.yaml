metadata:
  name: fx-grafana-datasources
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n  - name: Prometheus\n    uid: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://fx-prometheus:9090\n\
    \    isDefault: true\n    editable: true\n  - name: Loki\n    uid: loki\n    type:\
    \ loki\n    access: proxy\n    url: http://fx-loki:3100\n    editable: true\n\
    \    jsonData:\n      maxLines: 1000\n      derivedFields:\n        - datasourceUid:\
    \ tempo\n          matcherRegex: 'traceId=([a-f0-9]+)'\n          name: TraceID\n\
    \          url: '$${__value.raw}'\n  - name: Tempo\n    uid: tempo\n    type:\
    \ tempo\n    access: proxy\n    url: http://fx-tempo:3200\n    editable: true\n\
    \    jsonData:\n      httpMethod: GET\n      tracesToLogsV2:\n        datasourceUid:\
    \ loki\n        spanStartTimeShift: \"-5m\"\n        spanEndTimeShift: \"5m\"\n\
    \        tags:\n          - key: service.name\n            value: app\n"
