apiVersion: v1
kind: ConfigMap
metadata:
  name: fx-loki-config
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
data:
  loki.yaml: "auth_enabled: false\n\nserver:\n  http_listen_port: 3100\n  grpc_listen_port:\
    \ 9096\n\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix: /tmp/loki\n  replication_factor:\
    \ 1\n  ring:\n    kvstore:\n      store: inmemory\n  storage:\n    filesystem:\n\
    \      chunks_directory: /tmp/loki/chunks\n      rules_directory: /tmp/loki/rules\n\
    \nschema_config:\n  configs:\n    - from: 2024-01-01\n      store: tsdb\n    \
    \  object_store: filesystem\n      schema: v13\n      index:\n        prefix:\
    \ index_\n        period: 24h\n\nstorage_config:\n  filesystem:\n    directory:\
    \ /tmp/loki/chunks\n\nlimits_config:\n  allow_structured_metadata: true\n  volume_enabled:\
    \ true\n\ncompactor:\n  working_directory: /tmp/loki/compactor\n  compaction_interval:\
    \ 5m\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fx-tempo-config
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
data:
  tempo.yaml: "server:\n  http_listen_port: 3200\n\ndistributor:\n  receivers:\n \
    \   otlp:\n      protocols:\n        grpc:\n          endpoint: 0.0.0.0:4317\n\
    \        http:\n          endpoint: 0.0.0.0:4318\n\ningester:\n  trace_idle_period:\
    \ 10s\n  max_block_duration: 5m\n\ncompactor:\n  compaction:\n    block_retention:\
    \ 24h\n\nstorage:\n  trace:\n    backend: local\n    local:\n      path: /tmp/tempo/blocks\n\
    \    wal:\n      path: /tmp/tempo/wal\n"
