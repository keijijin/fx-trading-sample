apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fx-kafka
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  serviceName: fx-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: fx-kafka
  template:
    metadata:
      labels:
        app: fx-kafka
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: fx-kafka
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: fx-kafka
      containers:
      - name: kafka
        image: image-registry.openshift-image-registry.svc:5000/fx-trading-camel422/fx-kafka:camel422
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -ec
        - 'export KAFKA_NODE_ID=0

          export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://fx-kafka-0.fx-kafka-headless.fx-trading-camel422.svc.cluster.local:9092"

          export KAFKA_CONTROLLER_QUORUM_VOTERS="0@fx-kafka-0.fx-kafka-headless.fx-trading-camel422.svc.cluster.local:9093"

          exec /etc/kafka/docker/run

          '
        env:
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: '0'
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: '1'
        - name: KAFKA_NUM_PARTITIONS
          value: '6'
        - name: KAFKA_LOG_DIRS
          value: /tmp/kraft-combined-logs/data
        ports:
        - containerPort: 9092
          name: client
        - containerPort: 9093
          name: controller
        startupProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi
        volumeMounts:
        - name: kafka-data
          mountPath: /tmp/kraft-combined-logs
      enableServiceLinks: false
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
  podManagementPolicy: Parallel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-core-service
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-core-service
  template:
    metadata:
      labels:
        app: fx-core-service
    spec:
      containers:
      - name: fx-core-service
        image: image-registry.openshift-image-registry.svc:5000/fx-trading-camel422/fx-core-service:camel422
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: fx-core-db
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          value: fx_trading
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: fx-kafka:9092
        - name: SERVER_PORT
          value: '8080'
        - name: OUTBOX_POLL_PERIOD_MS
          value: '50'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://fx-tempo:4318/v1/traces
        - name: LOKI_URL
          value: http://fx-loki:3100/loki/api/v1/push
        - name: DB_POOL_MAX_SIZE
          value: '16'
        - name: DB_POOL_MIN_IDLE
          value: '4'
        - name: DB_POOL_CONNECTION_TIMEOUT_MS
          value: '5000'
        - name: DB_POOL_IDLE_TIMEOUT_MS
          value: '30000'
        - name: DB_POOL_MAX_LIFETIME_MS
          value: '300000'
        - name: BALANCE_BUCKET_COUNT
          value: '16'
        - name: ACTIVITY_DB_URL
          value: jdbc:postgresql://fx-trade-saga-db:5432/fx_trading
        - name: ACTIVITY_DB_USERNAME
          value: fx
        - name: SAGA_DB_URL
          value: jdbc:postgresql://fx-trade-saga-db:5432/fx_trading
        - name: SAGA_DB_USERNAME
          value: fx
        - name: ACTIVITY_DB_POOL_MAX_SIZE
          value: '8'
        - name: SAGA_DB_POOL_MAX_SIZE
          value: '5'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: password
        - name: ACTIVITY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: password
        - name: SAGA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: password
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 300m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1Gi
      enableServiceLinks: false
---
