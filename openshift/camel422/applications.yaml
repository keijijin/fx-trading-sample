apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-core-db
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-core-db
  template:
    metadata:
      labels:
        app: fx-core-db
    spec:
      containers:
      - name: postgres
        image: image-registry.openshift-image-registry.svc:5000/fx-trading-camel422/fx-postgres:camel422
        imagePullPolicy: Always
        args:
        - -c
        - max_connections=240
        - -c
        - log_lock_waits=on
        - -c
        - deadlock_timeout=100ms
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=10
        - -c
        - max_wal_senders=10
        env:
        - name: POSTGRES_DB
          value: fx_trading
        - name: PGDATA
          value: /tmp/pgdata/pgdata
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fx-database
              key: password
        ports:
        - containerPort: 5432
          name: postgres
        startupProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: '1'
            memory: 768Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /tmp/pgdata
      volumes:
      - name: initdb
        configMap:
          name: fx-postgres-init
      - name: data
        persistentVolumeClaim:
          claimName: fx-core-db-data
      enableServiceLinks: false
  strategy:
    type: Recreate
    rollingUpdate: null
---
