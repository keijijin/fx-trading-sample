apiVersion: v1
kind: ConfigMap
metadata:
  name: fx-postgres-init
  namespace: fx-trading-camel422
  labels:
    app.kubernetes.io/part-of: fx-trading-camel422
data:
  init.sql: "CREATE TABLE IF NOT EXISTS trade_order (\n    order_id VARCHAR(64) PRIMARY\
    \ KEY,\n    account_id VARCHAR(64) NOT NULL,\n    currency_pair VARCHAR(16) NOT\
    \ NULL,\n    side VARCHAR(8) NOT NULL,\n    order_type VARCHAR(16) NOT NULL,\n\
    \    order_amount DECIMAL(18,2) NOT NULL,\n    order_status VARCHAR(32) NOT NULL,\n\
    \    created_at TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP NOT NULL,\n    version_no\
    \ INTEGER NOT NULL DEFAULT 0\n);\n\nCREATE TABLE IF NOT EXISTS trade_execution\
    \ (\n    trade_id VARCHAR(64) PRIMARY KEY,\n    order_id VARCHAR(64) NOT NULL,\n\
    \    account_id VARCHAR(64) NOT NULL,\n    currency_pair VARCHAR(16) NOT NULL,\n\
    \    side VARCHAR(8) NOT NULL,\n    executed_price DECIMAL(18,8) NOT NULL,\n \
    \   executed_amount DECIMAL(18,2) NOT NULL,\n    execution_status VARCHAR(32)\
    \ NOT NULL,\n    executed_at TIMESTAMP NOT NULL,\n    version_no INTEGER NOT NULL\
    \ DEFAULT 0,\n    CONSTRAINT uk_trade_execution_order UNIQUE (order_id)\n);\n\n\
    CREATE TABLE IF NOT EXISTS account_balance (\n    account_id VARCHAR(64) NOT NULL,\n\
    \    currency VARCHAR(3) NOT NULL,\n    available_balance DECIMAL(18,2) NOT NULL,\n\
    \    held_balance DECIMAL(18,2) NOT NULL,\n    updated_at TIMESTAMP NOT NULL,\n\
    \    version_no INTEGER NOT NULL DEFAULT 0,\n    PRIMARY KEY (account_id, currency)\n\
    );\n\nCREATE TABLE IF NOT EXISTS account_balance_bucket (\n    account_id VARCHAR(64)\
    \ NOT NULL,\n    currency VARCHAR(3) NOT NULL,\n    bucket_no INTEGER NOT NULL,\n\
    \    available_balance DECIMAL(18,2) NOT NULL,\n    held_balance DECIMAL(18,2)\
    \ NOT NULL,\n    updated_at TIMESTAMP NOT NULL,\n    version_no INTEGER NOT NULL\
    \ DEFAULT 0,\n    PRIMARY KEY (account_id, currency, bucket_no)\n);\n\nCREATE\
    \ TABLE IF NOT EXISTS balance_hold (\n    hold_id VARCHAR(64) PRIMARY KEY,\n \
    \   trade_id VARCHAR(64) NOT NULL,\n    account_id VARCHAR(64) NOT NULL,\n   \
    \ bucket_no INTEGER NOT NULL DEFAULT 0,\n    hold_amount DECIMAL(18,2) NOT NULL,\n\
    \    hold_status VARCHAR(32) NOT NULL,\n    created_at TIMESTAMP NOT NULL,\n \
    \   updated_at TIMESTAMP NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS fx_position\
    \ (\n    position_id VARCHAR(64) PRIMARY KEY,\n    account_id VARCHAR(64) NOT\
    \ NULL,\n    currency_pair VARCHAR(16) NOT NULL,\n    net_amount DECIMAL(18,2)\
    \ NOT NULL,\n    average_price DECIMAL(18,8) NOT NULL,\n    updated_at TIMESTAMP\
    \ NOT NULL,\n    version_no INTEGER NOT NULL DEFAULT 0\n);\n\nCREATE TABLE IF\
    \ NOT EXISTS trade_saga (\n    trade_id VARCHAR(64) PRIMARY KEY,\n    order_id\
    \ VARCHAR(64) NOT NULL,\n    saga_status VARCHAR(32) NOT NULL,\n    cover_status\
    \ VARCHAR(32) NOT NULL,\n    risk_status VARCHAR(32) NOT NULL,\n    accounting_status\
    \ VARCHAR(32) NOT NULL,\n    settlement_status VARCHAR(32) NOT NULL,\n    notification_status\
    \ VARCHAR(32) NOT NULL,\n    compliance_status VARCHAR(32) NOT NULL,\n    cover_cancel_requested\
    \ BOOLEAN NOT NULL DEFAULT FALSE,\n    risk_cancel_requested BOOLEAN NOT NULL\
    \ DEFAULT FALSE,\n    accounting_cancel_requested BOOLEAN NOT NULL DEFAULT FALSE,\n\
    \    settlement_cancel_requested BOOLEAN NOT NULL DEFAULT FALSE,\n    correlation_id\
    \ VARCHAR(128) NOT NULL,\n    cover_completed_at TIMESTAMP NULL,\n    risk_completed_at\
    \ TIMESTAMP NULL,\n    accounting_completed_at TIMESTAMP NULL,\n    settlement_requested_at\
    \ TIMESTAMP NULL,\n    settlement_completed_at TIMESTAMP NULL,\n    notification_completed_at\
    \ TIMESTAMP NULL,\n    compliance_completed_at TIMESTAMP NULL,\n    created_at\
    \ TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP NOT NULL,\n    version_no INTEGER\
    \ NOT NULL DEFAULT 0\n);\n\nCREATE TABLE IF NOT EXISTS outbox_event (\n    event_id\
    \ VARCHAR(64) PRIMARY KEY,\n    aggregate_type VARCHAR(64) NOT NULL,\n    aggregate_id\
    \ VARCHAR(64) NOT NULL,\n    event_type VARCHAR(64) NOT NULL,\n    topic_name\
    \ VARCHAR(128) NOT NULL,\n    message_key VARCHAR(128) NOT NULL,\n    payload\
    \ TEXT NOT NULL,\n    status VARCHAR(16) NOT NULL,\n    retry_count INTEGER NOT\
    \ NULL DEFAULT 0,\n    next_retry_at TIMESTAMP NULL,\n    correlation_id VARCHAR(128)\
    \ NOT NULL,\n    source_service VARCHAR(64) NOT NULL,\n    created_at TIMESTAMP\
    \ NOT NULL,\n    sent_at TIMESTAMP NULL,\n    last_error_message VARCHAR(1024),\n\
    \    version_no INTEGER NOT NULL DEFAULT 0\n);\n\nCREATE INDEX IF NOT EXISTS idx_outbox_event_aggregate_id\
    \ ON outbox_event(aggregate_id);\nCREATE INDEX IF NOT EXISTS idx_outbox_event_poll\
    \ ON outbox_event(source_service, status, created_at)\n    WHERE status IN ('NEW',\
    \ 'RETRY');\n\nCREATE TABLE IF NOT EXISTS processed_message (\n    consumer_name\
    \ VARCHAR(64) NOT NULL,\n    event_id VARCHAR(64) NOT NULL,\n    processed_at\
    \ TIMESTAMP NOT NULL,\n    PRIMARY KEY (consumer_name, event_id)\n);\n\nCREATE\
    \ TABLE IF NOT EXISTS cover_trade (\n    cover_trade_id VARCHAR(64) PRIMARY KEY,\n\
    \    trade_id VARCHAR(64) NOT NULL,\n    cover_status VARCHAR(32) NOT NULL,\n\
    \    created_at TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP NOT NULL\n);\n\n\
    CREATE TABLE IF NOT EXISTS risk_record (\n    risk_record_id VARCHAR(64) PRIMARY\
    \ KEY,\n    trade_id VARCHAR(64) NOT NULL,\n    risk_status VARCHAR(32) NOT NULL,\n\
    \    created_at TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP NOT NULL\n);\n\n\
    CREATE TABLE IF NOT EXISTS accounting_entry (\n    accounting_entry_id VARCHAR(64)\
    \ PRIMARY KEY,\n    trade_id VARCHAR(64) NOT NULL,\n    accounting_status VARCHAR(32)\
    \ NOT NULL,\n    created_at TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP NOT\
    \ NULL\n);\n\nCREATE TABLE IF NOT EXISTS settlement_record (\n    settlement_record_id\
    \ VARCHAR(64) PRIMARY KEY,\n    trade_id VARCHAR(64) NOT NULL,\n    settlement_status\
    \ VARCHAR(32) NOT NULL,\n    created_at TIMESTAMP NOT NULL,\n    updated_at TIMESTAMP\
    \ NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS notification_record (\n    notification_id\
    \ VARCHAR(64) PRIMARY KEY,\n    trade_id VARCHAR(64) NOT NULL,\n    notification_type\
    \ VARCHAR(64) NOT NULL,\n    notification_status VARCHAR(32) NOT NULL,\n    created_at\
    \ TIMESTAMP NOT NULL\n);\n\nCREATE TABLE IF NOT EXISTS compliance_record (\n \
    \   compliance_id VARCHAR(64) PRIMARY KEY,\n    trade_id VARCHAR(64) NOT NULL,\n\
    \    compliance_status VARCHAR(32) NOT NULL,\n    created_at TIMESTAMP NOT NULL\n\
    );\n\nCREATE TABLE IF NOT EXISTS trade_activity (\n    activity_id VARCHAR(64)\
    \ PRIMARY KEY,\n    trade_id VARCHAR(64) NOT NULL,\n    service_name VARCHAR(64)\
    \ NOT NULL,\n    activity_type VARCHAR(64) NOT NULL,\n    activity_status VARCHAR(64)\
    \ NOT NULL,\n    detail VARCHAR(1024) NOT NULL,\n    event_type VARCHAR(64),\n\
    \    topic_name VARCHAR(128),\n    created_at TIMESTAMP NOT NULL\n);\n\nCREATE\
    \ INDEX IF NOT EXISTS idx_trade_activity_trade_id ON trade_activity(trade_id);\n\
    \nCREATE TABLE IF NOT EXISTS trade_query_projection (\n    trade_id VARCHAR(64)\
    \ PRIMARY KEY,\n    order_id VARCHAR(64) NOT NULL,\n    account_id VARCHAR(64)\
    \ NOT NULL,\n    currency_pair VARCHAR(16) NOT NULL,\n    trade_status VARCHAR(32)\
    \ NOT NULL,\n    saga_status VARCHAR(32) NOT NULL,\n    correlation_id VARCHAR(128)\
    \ NOT NULL,\n    cover_status VARCHAR(32) NOT NULL,\n    risk_status VARCHAR(32)\
    \ NOT NULL,\n    accounting_status VARCHAR(32) NOT NULL,\n    settlement_status\
    \ VARCHAR(32) NOT NULL,\n    notification_status VARCHAR(32) NOT NULL,\n    compliance_status\
    \ VARCHAR(32) NOT NULL,\n    updated_at TIMESTAMP NOT NULL\n);\n\nCREATE TABLE\
    \ IF NOT EXISTS trade_event_journal (\n    event_id VARCHAR(64) PRIMARY KEY,\n\
    \    trade_id VARCHAR(64) NOT NULL,\n    source_service VARCHAR(64) NOT NULL,\n\
    \    event_type VARCHAR(64) NOT NULL,\n    topic_name VARCHAR(128) NOT NULL,\n\
    \    status VARCHAR(32) NOT NULL,\n    created_at TIMESTAMP NOT NULL\n);\n\nCREATE\
    \ INDEX IF NOT EXISTS idx_trade_event_journal_trade_id ON trade_event_journal(trade_id,\
    \ created_at);\n"
---
