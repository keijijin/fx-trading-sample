    \  metrics_path: /actuator/prometheus\n  static_configs:\n  - targets:\n    -\
    \ fx-core-service:8080\n    labels:\n      namespace: fx-trading-camel422\n  \
    \    service: fx-core-service\n- job_name: trade-saga-service\n  metrics_path:\
    \ /actuator/prometheus\n  static_configs:\n  - targets:\n    - trade-saga-service:8081\n\
    \    labels:\n      namespace: fx-trading-camel422\n      service: trade-saga-service\n\
    - job_name: cover-service\n  metrics_path: /actuator/prometheus\n  static_configs:\n\
    \  - targets:\n    - cover-service:8082\n    labels:\n      namespace: fx-trading-camel422\n\
    \      service: cover-service\n- job_name: risk-service\n  metrics_path: /actuator/prometheus\n\
    \  static_configs:\n  - targets:\n    - risk-service:8083\n    labels:\n     \
    \ namespace: fx-trading-camel422\n      service: risk-service\n- job_name: accounting-service\n\
    \  metrics_path: /actuator/prometheus\n  static_configs:\n  - targets:\n    -\
    \ accounting-service:8084\n    labels:\n      namespace: fx-trading-camel422\n\
    \      service: accounting-service\n- job_name: settlement-service\n  metrics_path:\
    \ /actuator/prometheus\n  static_configs:\n  - targets:\n    - settlement-service:8085\n\
    \    labels:\n      namespace: fx-trading-camel422\n      service: settlement-service\n\
    - job_name: notification-service\n  metrics_path: /actuator/prometheus\n  static_configs:\n\
    \  - targets:\n    - notification-service:8086\n    labels:\n      namespace:\
    \ fx-trading-camel422\n      service: notification-service\n- job_name: compliance-service\n\
    \  metrics_path: /actuator/prometheus\n  static_configs:\n  - targets:\n    -\
    \ compliance-service:8087\n    labels:\n      namespace: fx-trading-camel422\n\
    \      service: compliance-service\n"
