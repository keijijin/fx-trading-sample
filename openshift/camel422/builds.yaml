apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: fx-core-service
  namespace: fx-trading-camel422
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: fx-core-service
  namespace: fx-trading-camel422
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: fx-core-service:camel422
  triggers: []
